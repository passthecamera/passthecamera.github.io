<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pass the Camera — booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #22201b;
    --paper: #efe7d8;
    --forest: #33473a;
    --brick: #a64b3b;
    --gold: #c79a4b;
    --accept: #3f5d45;
    --reject: #8a3a3a;
    --line: #453f34;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Work Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 16px 40px;
  }

  header.brand {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  header.brand .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--paper);
  }
  header.brand .tag {
    font-size: 0.75rem;
    color: #a8a190;
  }

  h1.title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin: 6px 0 4px;
    text-align: center;
  }

  p.sub {
    color: #a8a190;
    font-size: 0.9rem;
    margin: 0 0 20px;
    text-align: center;
    max-width: 320px;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 3 / 4;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
  }

  video, canvas.preview {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  canvas.preview { display: none; }

  .count-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(0,0,0,0.55);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    z-index: 3;
  }

  .brand-corner {
    position: absolute;
    top: 12px;
    left: 12px;
    font-family: 'Fraunces', serif;
    font-size: 0.8rem;
    background: rgba(0,0,0,0.55);
    padding: 6px 10px;
    border-radius: 999px;
    z-index: 3;
  }

  .review-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: none;
    gap: 10px;
    padding: 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    z-index: 4;
  }
  .review-bar.active { display: flex; }

  .review-bar button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Work Sans', sans-serif;
  }
  .review-bar .reject { background: var(--reject); color: var(--paper); }
  .review-bar .accept { background: var(--accept); color: var(--paper); }

  .thumbs {
    display: flex;
    gap: 6px;
    width: 100%;
    max-width: 420px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .thumbs img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--line);
  }

  .controls {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 420px;
  }

  button.shutter {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--brick);
    border: 4px solid var(--paper);
    cursor: pointer;
    transition: transform 100ms ease;
  }
  button.shutter:active { transform: scale(0.92); }
  button.shutter:disabled {
    background: #4a453b;
    cursor: not-allowed;
  }

  .status {
    font-size: 0.9rem;
    color: #a8a190;
    min-height: 20px;
    text-align: center;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--paper);
    font-size: 0.95rem;
    font-family: 'Work Sans', sans-serif;
  }
  input[type="text"]::placeholder { color: #756f60; }

  .done-screen {
    max-width: 340px;
    text-align: center;
    padding: 60px 20px;
  }
  .done-screen .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--gold);
    margin-bottom: 28px;
  }
  .done-screen h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    margin-bottom: 10px;
  }
  .done-screen p {
    color: #a8a190;
    font-size: 0.92rem;
  }

  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div id="app"></div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
  const UPLOAD_URL = "https://script.google.com/macros/s/AKfycbxOjO7qFmxWyHBTbOkvwE-yjfFJkUIp6krgodYO5wizvN-m43G14L6tFM-Ftt52sDwTdg/exec";
  const TARGET_COUNT = 10;
  const STORAGE_KEY_COUNT = 'ptc_count';
  const STORAGE_KEY_SESSION = 'ptc_sessionId';

  const app = document.getElementById('app');

  function getSessionId() {
    let id = localStorage.getItem(STORAGE_KEY_SESSION);
    if (!id) {
      id = 'sess_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
      localStorage.setItem(STORAGE_KEY_SESSION, id);
    }
    return id;
  }

  function getCount() {
    return parseInt(localStorage.getItem(STORAGE_KEY_COUNT) || '0', 10);
  }

  function setCount(n) {
    localStorage.setItem(STORAGE_KEY_COUNT, String(n));
  }

  if (getCount() >= TARGET_COUNT) {
    renderDoneScreen();
  } else {
    renderBoothScreen();
  }

  function renderDoneScreen() {
    app.innerHTML = `
      <div class="done-screen">
        <div class="wordmark">Pass the Camera</div>
        <h2>You're all set</h2>
        <p>Your 10 photos are in. Thank you for sharing them — go enjoy the rest of the event.</p>
      </div>
    `;
  }

  function renderBoothScreen() {
    const sessionId = getSessionId();
    let acceptedCount = getCount();
    let pendingPhoto = null;

    app.innerHTML = `
      <header class="brand">
        <span class="wordmark">Pass the Camera</span>
        <span class="tag">photo booth</span>
      </header>
      <h1 class="title">Take a photo</h1>
      <p class="sub">Review each one before it sends — only what you approve gets shared. ${TARGET_COUNT} photos total.</p>
      <input type="text" id="nameInput" placeholder="Your name (optional)" />
      <div class="stage" style="margin-top:14px;">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="previewCanvas" class="preview"></canvas>
        <div class="brand-corner">PTC</div>
        <div class="count-badge" id="countBadge">${acceptedCount} / ${TARGET_COUNT}</div>
        <div class="review-bar" id="reviewBar">
          <button class="reject" id="rejectBtn">Retake</button>
          <button class="accept" id="acceptBtn">Send this one</button>
        </div>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <div class="controls">
        <button class="shutter" id="shutterBtn" aria-label="Take photo"></button>
        <div class="status" id="status">Allow camera access to begin.</div>
      </div>
    `;

    const video = document.getElementById('video');
    const previewCanvas = document.getElementById('previewCanvas');
    const shutterBtn = document.getElementById('shutterBtn');
    const reviewBar = document.getElementById('reviewBar');
    const acceptBtn = document.getElementById('acceptBtn');
    const rejectBtn = document.getElementById('rejectBtn');
    const statusEl = document.getElementById('status');
    const countBadge = document.getElementById('countBadge');
    const thumbsEl = document.getElementById('thumbs');
    const nameInput = document.getElementById('nameInput');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = stream;
        statusEl.textContent = `${acceptedCount} of ${TARGET_COUNT} sent so far.`;
      } catch (err) {
        statusEl.textContent = 'Camera access was denied or is unavailable.';
      }
    }

    function exitReviewMode() {
      pendingPhoto = null;
      previewCanvas.style.display = 'none';
      video.style.display = 'block';
      reviewBar.classList.remove('active');
      shutterBtn.disabled = acceptedCount >= TARGET_COUNT;
      statusEl.textContent = `${acceptedCount} of ${TARGET_COUNT} sent so far.`;
    }

    function takePhoto() {
      if (acceptedCount >= TARGET_COUNT) return;
      previewCanvas.width = video.videoWidth;
      previewCanvas.height = video.videoHeight;
      previewCanvas.getContext('2d').drawImage(video, 0, 0, previewCanvas.width, previewCanvas.height);
      pendingPhoto = previewCanvas.toDataURL('image/jpeg', 0.85);

      previewCanvas.style.display = 'block';
      video.style.display = 'none';
      reviewBar.classList.add('active');
      shutterBtn.disabled = true;
      statusEl.textContent = 'Send this photo, or retake it.';
    }

    function rejectPhoto() {
      exitReviewMode();
    }

    async function acceptPhoto() {
      if (!pendingPhoto) return;
      acceptBtn.disabled = true;
      rejectBtn.disabled = true;
      statusEl.textContent = 'Sending…';

      if (UPLOAD_URL.includes('PASTE_YOUR_APPS_SCRIPT')) {
        statusEl.textContent = 'Upload URL not configured yet — see README.';
        acceptBtn.disabled = false;
        rejectBtn.disabled = false;
        return;
      }

      try {
        const response = await fetch(UPLOAD_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            sessionId: sessionId,
            name: nameInput.value.trim() || 'anonymous',
            timestamp: new Date().toISOString(),
            photoIndex: acceptedCount + 1,
            photo: pendingPhoto
          })
        });

        const result = await response.json();
        if (result.status !== 'ok') throw new Error(result.message || 'Unknown error');

        acceptedCount += 1;
        setCount(acceptedCount);

        const thumb = document.createElement('img');
        thumb.src = pendingPhoto;
        thumbsEl.appendChild(thumb);
        countBadge.textContent = `${acceptedCount} / ${TARGET_COUNT}`;

        acceptBtn.disabled = false;
        rejectBtn.disabled = false;

        if (acceptedCount >= TARGET_COUNT) {
          const stream = video.srcObject;
          if (stream) stream.getTracks().forEach(t => t.stop());
          renderDoneScreen();
          return;
        }

        exitReviewMode();

      } catch (err) {
        statusEl.textContent = 'Upload failed — check your connection and try again.';
        acceptBtn.disabled = false;
        rejectBtn.disabled = false;
      }
    }

    shutterBtn.addEventListener('click', takePhoto);
    acceptBtn.addEventListener('click', acceptPhoto);
    rejectBtn.addEventListener('click', rejectPhoto);

    startCamera();
  }
</script>

</body>
</html>
